name: TaskFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::139337687281:role/TaskFlowGitHubActionsRole
  FRONTEND_BUCKET: taskflow-frontend-139337687281-ap-south-1
  DEPLOY_BUCKET: taskflow-deploy-139337687281-ap-south-1
  CLOUDFRONT_DISTRIBUTION_ID: E1DY0LUYGMJBK0
  EC2_INSTANCE_ID: i-09859cc7be6f8e43b

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: |
          mkdir -p reports
          npm run lint 2>&1 | tee reports/frontend-lint.log

      - name: Upload frontend lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-report
          path: frontend/reports/frontend-lint.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskflow_test
          POSTGRES_PASSWORD: taskflow_test_password
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow_test -d taskflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: taskflow_test
      DB_USER: taskflow_test
      DB_PASSWORD: taskflow_test_password
      DB_SSL: "false"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend integration tests
        working-directory: backend
        run: |
          mkdir -p reports
          npm test > reports/backend-test.tap 2>&1

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/reports/backend-test.tap
          if-no-files-found: warn
          retention-days: 7

      - name: Remove development dependencies
        working-directory: backend
        run: npm prune --omit=dev

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: |
          node --check src/server.js
          node --check src/db.js

      - name: Package backend
        run: |
          tar -czf backend-${GITHUB_SHA}.tar.gz \
            -C backend \
            src package.json package-lock.json node_modules

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy to AWS Production
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci

    # Configure required reviewers on this GitHub environment
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: backend-package

      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC issuer: ${payload.iss}`);
            core.info(`OIDC audience: ${JSON.stringify(payload.aud)}`);
            core.info(`OIDC subject: ${payload.sub}`);

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend-dist/ \
            "s3://${FRONTEND_BUCKET}/" \
            --delete \
            --region "${AWS_REGION}"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Upload backend artifact to S3
        run: |
          aws s3 cp \
            "backend-package/backend-${GITHUB_SHA}.tar.gz" \
            "s3://${DEPLOY_BUCKET}/artifacts/backend/${GITHUB_SHA}.tar.gz" \
            --region "${AWS_REGION}"

      - name: Deploy backend through SSM
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -eu

          SHA="__GITHUB_SHA__"
          BASE="/opt/taskflow/deploy"
          BACKEND="${BASE}/backend"
          STAGE="${BASE}/backend-new-${SHA}"
          BACKUP="${BASE}/backend-backup-${SHA}"
          ARCHIVE="/tmp/taskflow-backend-${SHA}.tar.gz"

          echo "Downloading backend artifact..."
          aws s3 cp \
            "s3://taskflow-deploy-139337687281-ap-south-1/artifacts/backend/${SHA}.tar.gz" \
            "${ARCHIVE}" \
            --region ap-south-1

          echo "Preparing release..."
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          tar -xzf "${ARCHIVE}" -C "${STAGE}"

          if [ ! -f "${BACKEND}/.env" ]; then
            echo "ERROR: Existing backend .env was not found. Aborting."
            exit 1
          fi

          cp "${BACKEND}/.env" "${STAGE}/.env"
          chmod 600 "${STAGE}/.env"
          chown -R ubuntu:ubuntu "${STAGE}"

          echo "Switching backend release..."
          mv "${BACKEND}" "${BACKUP}"
          mv "${STAGE}" "${BACKEND}"

          if ! systemctl restart taskflow-backend.service; then
            echo "Restart failed. Rolling back..."
            rm -rf "${BACKEND}"
            mv "${BACKUP}" "${BACKEND}"
            systemctl restart taskflow-backend.service
            exit 1
          fi

          echo "Checking backend health..."
          HEALTHY=0
          for attempt in $(seq 1 18); do
            if /opt/taskflow/node/bin/node -e \
              "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
            then
              HEALTHY=1
              break
            fi
            sleep 5
          done

          if [ "${HEALTHY}" -ne 1 ]; then
            echo "Health check failed. Rolling back..."
            rm -rf "${BACKEND}"
            mv "${BACKUP}" "${BACKEND}"
            systemctl restart taskflow-backend.service
            exit 1
          fi

          echo "Backend deployment successful."
          rm -f "${ARCHIVE}"
          REMOTE
          )

          REMOTE_SCRIPT="${REMOTE_SCRIPT//__GITHUB_SHA__/${GITHUB_SHA}}"

          # Encode the complete script so SSM's /bin/sh does not parse Bash syntax.
          REMOTE_B64=$(printf '%s' "${REMOTE_SCRIPT}" | base64 -w0)
          SSM_COMMAND="printf '%s' '${REMOTE_B64}' | base64 -d | /bin/bash"

          PARAMETERS=$(jq -nc --arg command "$SSM_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "TaskFlow backend deployment ${GITHUB_SHA}" \
            --region "${AWS_REGION}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: ${COMMAND_ID}"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Backend deployment completed."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --region "${AWS_REGION}" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for SSM deployment."
          exit 1

      - name: Verify production application and CRUD API
        env:
          BASE_URL: https://d3n8y3tkbd3td2.cloudfront.net
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL;
          const marker = `CI smoke test ${Date.now()}`;
          let taskId;

          async function request(path, options = {}) {
            return fetch(`${base}${path}`, {
              ...options,
              headers: {
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
          }

          async function main() {
            const homepage = await request('/');
            if (!homepage.ok) throw new Error(`Frontend returned HTTP ${homepage.status}`);

            const list = await request('/api/tasks');
            if (!list.ok) throw new Error(`GET tasks returned HTTP ${list.status}`);
            const payload = await list.json();
            if (!payload || !Array.isArray(payload.tasks)) {
              throw new Error('GET /api/tasks response must contain a tasks array');
            }

            const created = await request('/api/tasks', {
              method: 'POST',
              body: JSON.stringify({
                title: marker,
                description: 'Temporary GitHub Actions smoke test',
                status: 'todo'
              })
            });
            if (created.status !== 201) throw new Error(`POST task returned HTTP ${created.status}`);
            const createdPayload = await created.json();
            taskId = createdPayload.task?.id;
            if (!taskId) throw new Error('POST response did not contain task.id');

            const updated = await request(`/api/tasks/${taskId}`, {
              method: 'PUT',
              body: JSON.stringify({
                title: `${marker} updated`,
                description: 'Updated by production smoke test',
                status: 'in_progress'
              })
            });
            if (!updated.ok) throw new Error(`PUT task returned HTTP ${updated.status}`);
            const updatedPayload = await updated.json();
            if (updatedPayload.task?.title !== `${marker} updated`) {
              throw new Error('Updated task response did not match');
            }

            const deleted = await request(`/api/tasks/${taskId}`, { method: 'DELETE' });
            if (deleted.status !== 204) throw new Error(`DELETE task returned HTTP ${deleted.status}`);
            taskId = undefined;
            console.log('Production frontend and CRUD smoke tests passed.');
          }

          main().catch(async error => {
            console.error(error);
            if (taskId) {
              try {
                const cleanup = await request(`/api/tasks/${taskId}`, { method: 'DELETE' });
                console.log(`Cleanup returned HTTP ${cleanup.status}`);
              } catch (cleanupError) {
                console.error('Cleanup failed:', cleanupError);
              }
            }
            process.exitCode = 1;
          });
          NODE
